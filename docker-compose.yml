services:
  api:
    build: .
    container_name: fastapi-deploy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/fastapidb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: fastapi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapidb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapidb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
